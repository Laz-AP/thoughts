<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>{{ page.title }} | {{ site.title }}</title>
<link rel="icon" href="https://laz-ap.github.io/thoughts/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://laz-ap.github.io/thoughts/assets/map/map.css">
</head>
<body>
<header>
  <a class="home" href="https://laz-ap.github.io/thoughts/">Architect's Palette</a>
  <div class="toggle" role="group" aria-label="View"><button id="bMap" aria-pressed="true">Map</button><button id="bList" aria-pressed="false">List</button></div>
</header>
<nav id="regions" aria-label="Jump to area"></nav>
<main id="main">
  <div id="map" aria-label="Map of Chicago buildings"></div>
  <div class="legend"><i></i>Video made &nbsp; <i class="s"></i>Site only</div>
  <div id="list"></div>
  <section class="card" id="card" aria-live="polite"></section>
</main>
<noscript><div class="noscript">The interactive map needs JavaScript. Read the stories on the <a href="https://laz-ap.github.io/thoughts/posts">posts page</a>.</div></noscript>
<script>
  window.AP_ROOT = "https://laz-ap.github.io/thoughts";
  window.AP_BUILDINGS = {{ site.data.buildings | jsonify }};
</script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://laz-ap.github.io/thoughts/assets/map/map.js"></script>
</body>
</html>
